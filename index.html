<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>投稿候補の承認</title>
<!--
  投稿候補の承認画面。1画面・スマホ向け。

  【何をする画面か】
  bot が作った投稿候補を並べて、○（そのまま出す）／△（直して出す）／
  ×（出さない）を押すだけ。押さなければ出ない。
  上に「採用率」と「編集率」が出る——**直す量が減っていくか**を見るため。

  【設定】初回に Supabase の URL と publishable キーを1度だけ入れる。
  入れた値はこの端末の localStorage に入り、リポジトリには残らない。
  **secret キーは絶対に入れないこと。**あれは RLS を通り抜ける。

  【この画面ができないこと】
  - X へ投稿しない（投稿は翌朝の便が、もう一度検査を通してから出す）
  - 候補を作らない・消さない（読みと判定の更新だけ）
    ○△ は「予約」。締切の1分前までは直す・取り消すができる
  - 日記は今日の1行だけ書ける（xbot_diary。消せない。空にすれば素材にならない）
  - 自分の行以外は1行も読めない（RLS）
-->
<style>
:root{
  --bg:#faf9f7; --fg:#1b1a19; --muted:#6b6763; --line:#e5e1dc;
  --card:#fff; --ok:#1f7a4d; --mid:#a86b1f; --no:#a33; --accent:#2f5fa8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#17161a; --fg:#eceaf0; --muted:#9b96a3; --line:#332f3a;
    --card:#201e25; --ok:#5fc08c; --mid:#d9a45a; --no:#e0736f; --accent:#8fb2e8;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.metrics{display:flex;gap:10px;margin:0 0 18px}
.m{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px}
.m b{display:block;font-size:22px;font-weight:650;letter-spacing:-.01em}
.m span{color:var(--muted);font-size:12px}
.warn{background:#fff6e5;border:1px solid #e8cfa0;color:#6b4f16;
  border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 16px}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]) .warn{background:#2b2415;border-color:#5b4a24;color:#e6cf9d}
}
.slot{margin:0 0 26px}
.slot>h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 8px;
  display:flex;justify-content:space-between;align-items:baseline}
.done{color:var(--ok);font-weight:600}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin:0 0 10px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.meta{color:var(--muted);font-size:12px;margin:0 0 8px}
.body{white-space:pre-wrap;word-break:break-word;margin:0 0 12px}
/* 採点は落とさない。指摘として見せるだけで、決めるのはJAM（2026-09-13） */
.why{font-size:12px;line-height:1.6;margin:0 0 12px;padding:8px 10px;
  border-radius:10px;background:color-mix(in srgb,var(--muted) 10%,transparent)}
.why b{color:var(--mid);font-weight:600}
.why span{color:var(--muted)}
.btns{display:flex;gap:8px}
button{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font-size:16px;font-weight:600;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px)}
button.on[data-v="○"]{background:var(--ok);border-color:var(--ok);color:#fff}
button.on[data-v="△"]{background:var(--mid);border-color:var(--mid);color:#fff}
button.on[data-v="×"]{background:var(--no);border-color:var(--no);color:#fff}
textarea{width:100%;min-height:120px;margin:10px 0 0;padding:10px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--fg);font:inherit;resize:vertical}
.save{margin:8px 0 0;width:100%;background:var(--accent);border-color:var(--accent);
  color:#fff}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
.login{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;margin:24px 0}
input[type=email]{width:100%;min-height:46px;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.empty{color:var(--muted);text-align:center;padding:40px 0}
/* 次の投稿予定（2026-09-13）。○か△で決めて、まだ出ていない本 */
.next{background:var(--card);border:1px solid var(--accent);border-radius:14px;
  padding:12px 14px;margin:0 0 18px}
.next h3{font-size:13px;color:var(--accent);margin:0 0 6px;font-weight:650}
.next .when{font-weight:650;font-size:15px}
.next .body{margin:4px 0 0}
.next .item+.item{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.next .none{color:var(--muted);font-size:13px}
.deadline{color:var(--muted);font-weight:400;font-size:12px}
.expired-head{font-size:13px;color:var(--mid);margin:30px 0 10px;
  padding-top:14px;border-top:1px dashed var(--line)}
.slot.expired .opt{opacity:.78}
.rbtns{display:flex;gap:8px;margin:8px 0 0}
.rbtns button{min-height:40px;font-size:14px}
/* 今日の日記（2026-09-13）。夜の便が翌日の投稿の素材にする */
.diary{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin:0 0 18px}
.diary h3{font-size:13px;margin:0 0 6px;font-weight:650}
.diary textarea{min-height:84px;margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>明日の投稿の承認</h1>
  <p class="sub" id="sub">読み込み中…</p>

  <div class="next" id="next" hidden></div>
  <div class="warn" id="missed" hidden></div>

  <div class="diary" id="diary" hidden>
    <h3>今日の日記 <span class="deadline" id="diaryDate"></span></h3>
    <textarea id="diaryText" maxlength="4000"
      placeholder="気になったこと・今日あったことを一行でいい"></textarea>
    <button class="save" id="diarySave">日記を保存</button>
    <p class="note" id="diaryNote"></p>
  </div>

  <div class="metrics" id="metrics" hidden>
    <div class="m"><b id="mAccept">—</b><span>採用率</span></div>
    <div class="m"><b id="mEdit">—</b><span>編集率</span></div>
    <div class="m"><b id="mJudged">—</b><span>判定した本数</span></div>
  </div>
  <div class="warn" id="gap" hidden></div>

  <div id="setup" class="login" hidden>
    <p style="margin:0 0 10px">はじめに、つなぎ先を1度だけ入れてください。
      <br><span class="note">この端末にだけ保存します。secret キーは入れないでください。</span></p>
    <input type="url" id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off">
    <input type="text" id="cfgKey" placeholder="publishable キー" autocomplete="off"
      style="margin-top:8px">
    <button class="save" id="cfgSave" style="margin-top:10px">保存する</button>
  </div>

  <div id="login" class="login" hidden>
    <p style="margin:0 0 10px">メールでログインします。届いたリンクを開くとこの画面に戻ります。</p>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <button class="save" id="sendLink" style="margin-top:10px">リンクを送る</button>
    <p class="note" id="loginNote"></p>
    <p class="note">戻り先: <code id="redirectHere"></code><br>
      これが Supabase の Redirect URLs に入っていないと、リンクが
      別の場所へ飛びます。</p>
  </div>

  <div id="list"></div>
</div>

<script type="module">
// ── 設定 ───────────────────────────────────────────────────────
// **リポジトリに値を書かない。**この画面を初めて開いたときに1度だけ入れて
// もらい、localStorage に置く。公開リポジトリに置いても、鍵も接続先も
// ファイルには残らない。
//
// publishable キーは公開してよいキー（旧 anon の後継）で、置き場所も
// 送り方も同じ（apikey ヘッダと Bearer）。**secret キーは入れない。**
const CFGKEY = "xbot.config";
let CONFIG = { url: "", publishable: "" };
try {
  CONFIG = Object.assign(CONFIG, JSON.parse(localStorage.getItem(CFGKEY) || "{}"));
} catch (e) { /* 消えていてもこのあと入力してもらうだけ */ }
// 埋め込みたい人のための逃げ道（置いた瞬間に公開される点に注意）
CONFIG.url = window.SUPABASE_URL || CONFIG.url;
CONFIG.publishable = window.SUPABASE_PUBLISHABLE_KEY
  || window.SUPABASE_ANON_KEY || CONFIG.publishable;

const REST = () => CONFIG.url + "/rest/v1";
const AUTH = () => CONFIG.url + "/auth/v1";
const KEY = "xbot.session";

// マジックリンクの戻り先。**このページ自身の URL に固定する。**
//
// 渡さないと Supabase が Site URL に落ちる。既定のままだと localhost、
// 直しても origin（https://…github.io）止まりで、/xbot-approve/ に
// 戻ってこない＝404 になる（2026-09-12 に実際そうなった）。
//
// location.origin は使わない。**それが今回の原因**。
// new URL(".", …) はこのページが置かれている階層を返すので、
//   /xbot-approve/           → /xbot-approve/
//   /xbot-approve/index.html → /xbot-approve/
// どちらでも同じ場所に戻る。手元の file:// でも壊れない。
//
// **Supabase 側の許可リストに同じ URL が要る**（Authentication →
// URL Configuration → Redirect URLs）。載っていないと、渡しても
// 黙って Site URL に落ちる。
const PAGE = new URL(".", location.href).href;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/[<>&]/g, (c) =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

let session = null;

// ── セッション ──────────────────────────────────────────────────
function saveSession(s) {
  session = s;
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* 個人用の窓なので握って進む */ }
}
function loadSession() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {
    saveSession({ access_token: h.get("access_token"),
                  refresh_token: h.get("refresh_token") });
    history.replaceState(null, "", location.pathname + location.search);
    return session;
  }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) session = JSON.parse(raw);
  } catch (e) { session = null; }
  return session;
}

async function api(path, opt = {}) {
  const r = await fetch(path, {
    ...opt,
    headers: {
      apikey: CONFIG.publishable,
      Authorization: "Bearer " + (session ? session.access_token : CONFIG.publishable),
      "Content-Type": "application/json",
      ...(opt.headers || {}),
    },
  });
  if (r.status === 401) { session = null; localStorage.removeItem(KEY); throw new Error("ログインが切れています"); }
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

$("cfgSave").onclick = () => {
  const url = $("cfgUrl").value.trim().replace(/\/+$/, "");
  const key = $("cfgKey").value.trim();
  if (!url || !key) return;
  if (/^sb_secret_/.test(key)) {
    alert("それは secret キーです。publishable キーを入れてください。");
    return;
  }
  CONFIG = { url, publishable: key };
  try { localStorage.setItem(CFGKEY, JSON.stringify(CONFIG)); } catch (e) { /* 保存できなくても今回は動く */ }
  location.reload();
};

$("sendLink").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return;
  $("loginNote").textContent = "送信中…";
  try {
    // redirect_to はクエリで渡す（GoTrue の作法。supabase-js も同じ）。
    const r = await fetch(
      AUTH() + "/otp?redirect_to=" + encodeURIComponent(PAGE), {
        method: "POST",
        headers: { apikey: CONFIG.publishable,
                   "Content-Type": "application/json" },
        body: JSON.stringify({ email, create_user: false }),
      });
    // **返事を見る。**前は成否に関係なく「送りました」と出していたので、
    // 許可リストに載っていない・ユーザーが居ない、が黙って通っていた。
    if (!r.ok) {
      const t = await r.text();
      $("loginNote").textContent = "送れませんでした: " + t.slice(0, 160);
      return;
    }
    $("loginNote").textContent = "メールを送りました。リンクを開いてください。";
  } catch (e) { $("loginNote").textContent = "送れませんでした: " + e.message; }
};

// ── 物差し（scripts/style_metrics.py と同じ数え方）──────────────────
function distance(a, b) {
  a = a || ""; b = b || "";
  if (a === b) return 0;
  if (!a || !b) return a.length || b.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)));
    }
    prev = cur;
  }
  return prev[b.length];
}
const rateOf = (a, b) => {
  const n = Math.max((a || "").length, (b || "").length);
  return n ? distance(a, b) / n : 0;
};
const pickedText = (r) => {
  const opts = r.options || [];
  const hit = opts.find((o) => (o.id || "").toUpperCase()
    === (r.choice || "").toUpperCase());
  return (hit || opts[0] || {}).text || "";
};

function renderMetrics(rows) {
  let ok = 0, judged = 0, none = 0;
  const rates = [];
  for (const r of rows) {
    const v = r.verdict;
    if (v === "○" || v === "選") { ok++; judged++; rates.push(0); }
    else if (v === "△") { judged++; if (r.final_text) rates.push(rateOf(pickedText(r), r.final_text)); }
    else if (v === "×") { judged++; }
    else none++;
  }
  $("metrics").hidden = false;
  $("mAccept").textContent = judged ? Math.round(100 * ok / judged) + "%" : "—";
  $("mEdit").textContent = rates.length
    ? Math.round(100 * rates.reduce((a, b) => a + b, 0) / rates.length) + "%" : "—";
  $("mJudged").textContent = judged + " 本";
  // 未反応は0%ではなく欠測。混ぜると1週目と2週目を比べられない
  $("gap").hidden = !(none > judged);
  $("gap").textContent = "未反応が " + none + " 本あります。"
    + "未反応は0%ではなく欠測なので、この数字はまだ基準値に使えません。";
}

// ── 締切と投稿予定（2026-09-13）──────────────────────────────────
// 投稿予定の時刻＝承認の締切。bot が候補に post_at / window_end を
// 書き写してある（scripts/approve.py の times_of）。**締切の判定の正本は
// bot 側**で、ここは見せるだけ。締切を過ぎて押した ○△ は投稿されず、
// 採用率・編集率にだけ入る。
const LABEL = { morning: "朝枠", night: "夜枠" };
const APPROVED = ["○", "△", "選"];
const todayJST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const timesOf = (r) => {
  const o = (r.options || []).find((x) => x.post_at) || null;
  return o ? { post: new Date(o.post_at), end: new Date(o.window_end || o.post_at) } : null;
};
const expired = (r) => {
  const t = timesOf(r);
  // 時刻を持たない行は 2026-09-13 朝枠までの古い行だけ。どれももう締切を過ぎている
  return t ? Date.now() > t.post.getTime() : r.date <= todayJST();
};
const lateVerdict = (r) => {
  const t = timesOf(r);
  if (!t) return r.date <= todayJST();
  return !r.decided_at || new Date(r.decided_at) > t.post;
};
const posted = (r) => (r.options || []).some((o) => o.posted_at);
// 予約を直せるのは締切の1分前まで（2026-09-13）。締切を過ぎてから直すと
// bot は「締切後の判定」として**予約ごと出さなくなる**ので、端末の時計の
// ずれを見込んで手前で止める。
const EDIT_MARGIN_MS = 60e3;
const editable = (r) => { const t = timesOf(r);
  return !!t && !posted(r) && Date.now() < t.post.getTime() - EDIT_MARGIN_MS; };
let ROWS = [];
const finalText = (r) => (r.verdict === "△" && r.final_text) ? r.final_text : pickedText(r);
const fmt = (d) => d.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo",
  month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });

function renderNext(rows) {
  const now = Date.now();
  const ok = rows.filter((r) => APPROVED.includes(r.verdict) && !lateVerdict(r) && !posted(r));
  const next = ok.filter((r) => { const t = timesOf(r); return t && now <= t.end.getTime(); })
    .sort((a, b) => timesOf(a).post - timesOf(b).post);
  $("next").hidden = false;
  $("next").innerHTML = `<h3>予約（次の投稿予定）</h3>` + (next.length
    ? next.map((r) => `<div class="item" data-date="${r.date}" data-slot="${r.slot}">
        <div class="when">${esc(fmt(timesOf(r).post))}ごろ ・ ${esc(LABEL[r.slot] || r.slot)}</div>
        <div class="body">${esc(finalText(r))}</div>
        ${editable(r)
          ? `<div class="rbtns"><button data-r="edit">直す</button><button data-r="cancel">取消</button></div>
             <div data-redit hidden>
               <textarea>${esc(finalText(r))}</textarea>
               <button class="save" data-r="save">この文で予約する</button>
             </div>`
          : `<p class="note">締切の直前なので、もう直せません。このまま出ます。</p>`}
      </div>`).join("")
      + `<p class="note">締切の1分前まで直す・取り消すができます。GitHub の混雑で、この時刻より遅れて出ることがあります。</p>`
    : `<p class="none">まだありません。締切までに ○ か △ を押すと、ここに予約されます。</p>`);
  // 締切までに決めたのに、枠が終わっても出た印が無い（直近1日だけ見る）
  const missed = ok.filter((r) => { const t = timesOf(r);
    return t && now > t.end.getTime() && now - t.end.getTime() < 24 * 3600e3; });
  $("missed").hidden = !missed.length;
  $("missed").textContent = missed.map((r) => `${r.date} ${LABEL[r.slot] || r.slot}`).join("、")
    + " は承認しましたが、出た記録がありません（便が飛んだか、直した文が検査に当たりました）。";
}

function card(row, o) {
  const sel = (row.choice || "").toUpperCase() === (o.id || "").toUpperCase();
  const bits = [o.kind_name, o.theme ? "種「" + o.theme + "」" : null,
    (o.weighted_len || 0) + "字",
    o.score != null ? "機械 " + o.score + "点" : null].filter(Boolean);
  // 機械の指摘は落とす理由ではなく、読むときの手がかり。
  // 当たった観点があれば太字、無ければ「指摘なし」と出す（2026-09-13）。
  const hits = o.gate_reasons || [];
  const why = (o.score == null && !hits.length && !o.score_reason) ? "" :
    `<div class="why">${hits.length
      ? "<b>指摘: " + esc(hits.join(" / ")) + "</b>"
      : "<span>機械の指摘はありません</span>"}${o.score_reason
      ? `<br><span>${esc(o.score_reason)}</span>` : ""}</div>`;
  return `<div class="opt ${sel ? "sel" : ""}" data-opt="${esc(o.id)}">
    <div class="meta">${esc(o.id)} ・ ${esc(bits.join(" / "))}</div>
    <div class="body">${esc(o.text)}</div>
    ${why}
    <div class="btns">
      ${["○", "△", "×"].map((v) => `<button data-v="${v}"
        class="${sel && (row.verdict === v || (v === "○" && row.verdict === "選")) ? "on" : ""}">${v}</button>`).join("")}
    </div>
    <div data-edit hidden>
      <textarea placeholder="直した本文をここに書く（💦 や () はそのままで大丈夫です）">${esc(sel && row.verdict === "△" ? (row.final_text || o.text) : o.text)}</textarea>
      <button class="save">この文で決定</button>
    </div>
  </div>`;
}

function section(r, isExpired) {
  const t = timesOf(r);
  const dl = t && !isExpired ? `<span class="deadline">締切 ${esc(fmt(t.post))}</span>` : "";
  return `
    <section class="slot ${isExpired ? "expired" : ""}" data-date="${r.date}" data-slot="${r.slot}"
      data-expired="${isExpired ? 1 : 0}">
      <h2><span>${r.date} ${LABEL[r.slot] || r.slot} ${dl}</span>
        ${r.verdict ? `<span class="done">${esc(r.verdict)}${r.choice ? " " + esc(r.choice) : ""}${r.verdict !== "×" && lateVerdict(r) ? "（計測のみ）" : ""}</span>` : ""}</h2>
      ${(r.options || []).map((o) => card(r, o)).join("")}
    </section>`;
}

function render(rows) {
  ROWS = rows;
  renderNext(rows);
  renderMetrics(rows);
  // 判定待ちは**何日経っても残す**（2026-09-13）。締切の前と後で分ける。
  const pending = rows.filter((r) => !r.verdict);
  const open = pending.filter((r) => !expired(r));
  const old = pending.filter((r) => expired(r)).reverse();   // 新しい順
  $("sub").textContent = open.length
    ? "○ をひとつ選ぶと、その1本を締切の時刻に出します。何も押さなければ出しません。"
    : pending.length
      ? "締切前の候補はありません。締切を過ぎた候補は、押すと計測にだけ使います。"
      : "いまは判定待ちがありません。直近の2件を出しています。";
  if (!rows.length) {
    $("list").innerHTML = `<p class="empty">まだ候補がありません。<br>夜の便が作ると、ここに並びます。</p>`;
    return;
  }
  if (!pending.length) {
    $("list").innerHTML = rows.slice(-2).map((r) => section(r, expired(r))).join("");
    return;
  }
  $("list").innerHTML = open.map((r) => section(r, false)).join("")
    + (old.length ? `<p class="expired-head">締切を過ぎた候補（${old.length}件）<br>
        <span class="note">押しても投稿しません。採用率・編集率には入ります。</span></p>` : "")
    + old.map((r) => section(r, true)).join("");
}

// ── 判定を書く ──────────────────────────────────────────────────
async function put(date, slot, verdict, choice, final) {
  await api(`${REST()}/xbot_proposals?date=eq.${date}&slot=eq.${slot}`, {
    method: "PATCH",
    headers: { Prefer: "return=minimal" },
    body: JSON.stringify({
      verdict, choice, final_text: final || null,
      decided_at: new Date().toISOString(),
    }),
  });
}

// ── 予約を直す・取り消す（2026-09-13）──────────────────────────────
// 取消は判定を空に戻す。decided_at には取消の時刻を残す——Issue に前に書いた
// コメント（「朝 B1」など）が、次の便の取り込みで予約を生き返らせないように
// （approve.py の collect は decided_at より前のコメントを読まない）。
$("next").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button[data-r]");
  if (!btn) return;
  const item = btn.closest("[data-date]");
  const r = ROWS.find((x) => x.date === item.dataset.date && x.slot === item.dataset.slot);
  if (!r) return;
  const edit = item.querySelector("[data-redit]");
  if (btn.dataset.r === "edit") { edit.hidden = !edit.hidden; return; }
  if (!editable(r)) {
    alert("締切の直前なので、もう直せません。このまま出ます。");
    await refresh();
    return;
  }
  const choice = r.choice || ((r.options || [])[0] || {}).id || null;
  btn.disabled = true;
  try {
    if (btn.dataset.r === "cancel") {
      if (!confirm("予約を取り消します。この枠は判定待ちに戻り、締切までに押し直さなければ出ません。")) {
        btn.disabled = false; return;
      }
      await put(r.date, r.slot, null, null, null);
    } else {
      const t = item.querySelector("textarea").value.trim();
      if (!t) { btn.disabled = false; return; }
      const orig = ((r.options || []).find((o) => (o.id || "").toUpperCase()
        === (choice || "").toUpperCase()) || {}).text;
      // 元の本文に戻しただけなら ○（直していない）として残す
      if (t === orig) await put(r.date, r.slot, "○", choice, null);
      else await put(r.date, r.slot, "△", choice, t);
    }
    await refresh();
  } catch (e) { btn.disabled = false; alert(e.message); }
});

// ── 今日の日記（2026-09-13）──────────────────────────────────────
// 1日1行（xbot_diary）。夜の便（21:30）が diary/ と一緒に読み、
// **翌日の投稿の素材**にする。書いた日の日付で保存する。
const DIARY_NOTE = "21:30 の便より前に保存した分が、明日の投稿の素材になります。書かなくても投稿は止まりません。";
async function loadDiary() {
  const d = todayJST();
  $("diary").hidden = false;
  $("diaryDate").textContent = d;
  try {
    const got = await api(`${REST()}/xbot_diary?date=eq.${d}&select=text,updated_at`);
    const row = (got || [])[0];
    if (row && document.activeElement !== $("diaryText")) $("diaryText").value = row.text;
    $("diaryNote").textContent = row
      ? `保存済み（${fmt(new Date(row.updated_at))}）。` + DIARY_NOTE : DIARY_NOTE;
  } catch (e) {
    $("diarySave").disabled = true;
    $("diaryNote").textContent = "日記の置き場所にまだつながりません"
      + "（Ledger のマイグレーション待ちかもしれません）: " + e.message;
  }
}
$("diarySave").onclick = async () => {
  const btn = $("diarySave");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    // user_id は送らない（表の既定値＝ログイン中の本人）。同じ日は上書き。
    await api(`${REST()}/xbot_diary?on_conflict=user_id,date`, {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ date: todayJST(), text: $("diaryText").value.trim() }),
    });
    await loadDiary();
  } catch (e) { alert("保存できませんでした: " + e.message); }
  btn.disabled = false; btn.textContent = "日記を保存";
};

$("list").addEventListener("click", async (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  const opt = btn.closest("[data-opt]");
  const sec = btn.closest("[data-date]");
  if (!opt || !sec) return;
  const { date, slot } = sec.dataset;
  const id = opt.dataset.opt;
  const edit = opt.querySelector("[data-edit]");
  // 締切を過ぎた候補の ○△ は投稿されない。押す前に一言だけ確かめる。
  const lateOk = () => sec.dataset.expired !== "1"
    || confirm("締切を過ぎているので投稿しません。採用率・編集率の計測にだけ使います。よいですか？");

  if (btn.classList.contains("save")) {
    const t = opt.querySelector("textarea").value.trim();
    if (!t || !lateOk()) return;
    btn.disabled = true; btn.textContent = "保存中…";
    try { await put(date, slot, "△", id, t); await refresh(); }
    catch (e) { btn.disabled = false; btn.textContent = "この文で決定"; alert(e.message); }
    return;
  }
  const v = btn.dataset.v;
  if (!v) return;
  if (v === "△") {                        // 直す欄を開くだけ。保存は「決定」で
    edit.hidden = !edit.hidden;
    opt.querySelectorAll("[data-v]").forEach((b) => b.classList.toggle("on", b === btn && !edit.hidden));
    return;
  }
  if (v === "○" && !lateOk()) return;
  btn.disabled = true;
  try { await put(date, slot, v, id, null); await refresh(); }
  catch (e) { btn.disabled = false; alert(e.message); }
});

// ── 起動 ───────────────────────────────────────────────────────
async function refresh() {
  const rows = await api(`${REST()}/xbot_proposals?order=date.asc,slot.asc`);
  render(rows || []);
}

(async () => {
  $("redirectHere").textContent = PAGE;
  if (!CONFIG.url || !CONFIG.publishable) {
    $("setup").hidden = false;
    $("sub").textContent = "つなぎ先を入れてください。";
    return;
  }
  loadSession();
  if (!session) { $("login").hidden = false; $("sub").textContent = "ログインしてください。"; return; }
  try { await refresh(); }
  catch (e) {
    $("login").hidden = false;
    $("sub").textContent = "読み込めませんでした: " + e.message;
    return;
  }
  // 日記が読めなくても（表がまだ無くても）候補の画面は使えるようにする
  await loadDiary();
})();
</script>
